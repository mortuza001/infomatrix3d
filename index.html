<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InfoMatrix | Smart Desktop Ticker</title>

  <style>
    :root {
      --primary: #00d1b2;
      --bg: #050505;
      --card: #111111;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    header {
      padding: 50px 20px;
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      margin: 0 0 10px;
      letter-spacing: -2px;
      font-weight: 800;
    }

    .tagline {
      font-size: 1.15rem;
      color: var(--muted);
      margin: 0 0 25px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }

    /* HERO MEDIA */
    .hero-media {
      width: 100%;
      background: #000;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      overflow: hidden;
      margin-bottom: 30px;
    }

    .slideshow-container {
      position: relative;
      width: 100%;
    }

    .mySlides {
      display: none;
      width: 100%;
    }

    /* Make both images and iframes fill width */
    .slide-asset {
      width: 100%;
      display: block;
      border: 0;
    }

    /* Responsive video wrapper so iframe never shrinks */
    .video-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .video-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Buttons */
    .prev, .next {
      cursor: pointer;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      padding: 14px 16px;
      color: white;
      background: rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 999px;
      user-select: none;
      z-index: 10;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .prev:hover, .next:hover {
      background: rgba(0,0,0,0.7);
      transform: translateY(-50%) scale(1.05);
    }

    .prev { left: 12px; }
    .next { right: 12px; }

    /* Dots */
    .dots-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 12px 0 14px;
      background: rgba(0,0,0,0.15);
      border-top: 1px solid rgba(255,255,255,0.06);
    }

    .dot {
      cursor: pointer;
      height: 10px;
      width: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.35);
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .dot:hover { transform: scale(1.2); }
    .dot.active { background: var(--primary); }

    /* Fade animation (optional) */
    .fade {
      animation-name: fade;
      animation-duration: 0.4s;
    }

    @keyframes fade {
      from { opacity: 0.3; }
      to   { opacity: 1; }
    }

    @media (max-width: 600px) {
      h1 { font-size: 2.2rem; }
      header { padding: 40px 15px; }
    }
  </style>
</head>

<body>
  <header>
    <h1>InfoMatrix</h1>
    <p class="tagline">The Ultimate Wi‑Fi Desktop Ticker for Sports, Stocks and Crypto</p>
  </header>

  <div class="container">
    <div class="hero-media" id="heroMedia">
      <div class="slideshow-container" id="slideshow">

        <!-- Slide 1 -->
        <div class="mySlides fade">
          <img src="image-1.jpg" class="slide-asset" alt="Desk setup view">
        </div>

        <!-- Slide 2 -->
        <div class="mySlides fade">
          <img src="matrix-nba.jpg" class="slide-asset" alt="Product Sports Score">
        </div>

        <!-- Slide 3 (YouTube) -->
        <div class="mySlides fade" data-type="youtube" data-video-id="CIzUx96CPGs">
          <div class="video-wrap">
            <iframe
              class="yt-frame"
              src="https://www.youtube.com/embed/CIzUx96CPGs?autoplay=1&mute=1&loop=1&playlist=CIzUx96CPGs&controls=0&rel=0"
              allow="autoplay; encrypted-media; picture-in-picture"
              allowfullscreen
              title="InfoMatrix demo video">
            </iframe>
          </div>
        </div>

        <!-- Slide 4 -->
        <div class="mySlides fade">
          <img src="matrix-epl.jpg" class="slide-asset" alt="EPL mode">
        </div>

        <!-- Slide 5 -->
        <div class="mySlides fade">
          <img src="image-4.JPEG" class="slide-asset" alt="Product close up">
        </div>

        <!-- Controls -->
        <button class="prev" type="button" aria-label="Previous slide">&#10094;</button>
        <button class="next" type="button" aria-label="Next slide">&#10095;</button>
      </div>

      <!-- Dots will be generated here -->
      <div class="dots-container" id="dots"></div>
    </div>
  </div>

  <script>
    // ================================
    // Slideshow: auto-rotate + dots + pause on hover
    // Also: stop YouTube playback when slide hidden
    // ================================

    let slideIndex = 0;
    let timer = null;
    const intervalMs = 6000; // change this (e.g., 4000 = 4 seconds)

    const heroMedia = document.getElementById("heroMedia");
    const slides = Array.from(document.getElementsByClassName("mySlides"));
    const prevBtn = document.querySelector(".prev");
    const nextBtn = document.querySelector(".next");
    const dotsWrap = document.getElementById("dots");

    // Generate dots automatically to match slides length
    const dots = slides.map((_, i) => {
      const dot = document.createElement("span");
      dot.className = "dot";
      dot.addEventListener("click", () => {
        goToSlide(i);
        restartAuto();
      });
      dotsWrap.appendChild(dot);
      return dot;
    });

    function showSlide(index) {
      if (slides.length === 0) return;

      // Wrap around
      if (index >= slides.length) index = 0;
      if (index < 0) index = slides.length - 1;

      // Stop YouTube playback on previous slide (if any)
      stopYouTubeInSlide(slides[slideIndex]);

      // Hide all slides
      slides.forEach(s => (s.style.display = "none"));
      dots.forEach(d => d.classList.remove("active"));

      // Show current
      slides[index].style.display = "block";
      dots[index].classList.add("active");

      slideIndex = index;
    }

    function nextSlide() { showSlide(slideIndex + 1); }
    function prevSlide() { showSlide(slideIndex - 1); }

    function goToSlide(i) { showSlide(i); }

    function startAuto() {
      stopAuto();
      timer = setInterval(() => nextSlide(), intervalMs);
    }

    function stopAuto() {
      if (timer) clearInterval(timer);
      timer = null;
    }

    function restartAuto() {
      startAuto();
    }

    // Stop YouTube when leaving that slide by resetting iframe src
    function stopYouTubeInSlide(slideEl) {
      if (!slideEl) return;
      const iframe = slideEl.querySelector("iframe.yt-frame");
      if (!iframe) return;

      // Reset the src to stop playback when hidden
      const src = iframe.getAttribute("src");
      iframe.setAttribute("src", src);
    }

    // Wire buttons
    prevBtn.addEventListener("click", () => { prevSlide(); restartAuto(); });
    nextBtn.addEventListener("click", () => { nextSlide(); restartAuto(); });

    // Pause on hover (nice UX)
    heroMedia.addEventListener("mouseenter", stopAuto);
    heroMedia.addEventListener("mouseleave", startAuto);

    // Start
    showSlide(0);
    startAuto();
  </script>
</body>
</html>
